name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test -r expanded

      - name: Configure Gradle Maven mirror (avoid Maven Central 429)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
                  google()
                  gradlePluginPortal()
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
                  google()
                  gradlePluginPortal()
              }
          }
          gradle.projectsLoaded { g ->
              g.rootProject.allprojects { p ->
                  p.buildscript.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.startsWith('https://repo.maven.apache.org/maven2') || u.startsWith('https://repo1.maven.org/maven2')) {
                              repo.url = p.uri('https://maven-central.storage-download.googleapis.com/maven2')
                          }
                      }
                  }
                  p.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.startsWith('https://repo.maven.apache.org/maven2') || u.startsWith('https://repo1.maven.org/maven2')) {
                              repo.url = p.uri('https://maven-central.storage-download.googleapis.com/maven2')
                          }
                      }
                  }
              }
          }
          EOF

      - name: Configure stable test signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/zapslot-test.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../keystore/zapslot-test.jks
          EOF
          echo "签名配置已写入（密钥来自 GitHub Secrets，不进仓库）"

      - name: Build Android Release APK (per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=APP_BUILD="$(git rev-parse --short HEAD) · $(date +%m-%d\ %H:%M)"


      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapslot-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release (direct APK download)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ZapSlot-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ZapSlot-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ZapSlot-x86_64.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ZapSlot-arm64-v8a.apk ZapSlot-armeabi-v7a.apk ZapSlot-x86_64.apk --clobber
          else
            gh release create latest ZapSlot-arm64-v8a.apk ZapSlot-armeabi-v7a.apk ZapSlot-x86_64.apk \
              --title "闪雀 (ZapSlot) 最新安装包" \
              --notes "自动构建发布的最新 Android APK 与 iOS 未签名 IPA 安装包（主流安卓选 arm64-v8a，iOS 侧载使用 ZapSlot-ios-unsigned.ipa）。"
          fi

  build-ios:
    runs-on: macos-latest
    needs: analyze-test-build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS Release (unsigned .app)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=APP_BUILD="$(git rev-parse --short HEAD) · $(date +%m-%d\ %H:%M)"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r -y ZapSlot-ios-unsigned.ipa Payload
          ls -lh ZapSlot-ios-unsigned.ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapslot-ios-unsigned-ipa
          path: ZapSlot-ios-unsigned.ipa

      - name: Publish iOS IPA to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ZapSlot-ios-unsigned.ipa --clobber
          else
            gh release create latest ZapSlot-ios-unsigned.ipa \
              --title "闪雀 (ZapSlot) 最新安装包" \
              --notes "自动构建发布的最新 Android APK 与 iOS 未签名 IPA 安装包。"
          fi
